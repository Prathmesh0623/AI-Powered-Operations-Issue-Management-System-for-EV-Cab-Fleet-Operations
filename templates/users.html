{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<div style="display:flex; justify-content:space-between; align-items:center;">
  <h2>Users</h2>
  <button class="btn btn-primary" id="new-user-btn">+ New User</button>
</div>

<div class="card" id="new-user-form" style="display:none; max-width:480px;">
  <div class="form-group"><label>Name</label><input id="nu-name" /></div>
  <div class="form-group"><label>Email</label><input id="nu-email" type="email" /></div>
  <div class="form-group"><label>Password</label><input id="nu-password" type="password" /></div>
  <div class="form-group">
    <label>Role</label>
    <select id="nu-role">
      <option value="admin">admin</option>
      <option value="ops_manager">ops_manager</option>
      <option value="operator" selected>operator</option>
      <option value="maintenance">maintenance</option>
    </select>
  </div>
  <button class="btn btn-primary btn-sm" id="save-user-btn">Save</button>
  <p id="user-form-error" style="color:#e5484d; font-size:13px; margin-top:8px;"></p>
</div>

<div class="card">
  <table>
    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Team</th><th>Active</th><th></th></tr></thead>
    <tbody id="users-tbody"><tr><td colspan="6">Loading...</td></tr></tbody>
  </table>
</div>
{% endblock %}
{% block extra_js %}
<script>
  requireAuth();

  async function loadUsers() {
    const tbody = document.getElementById("users-tbody");
    try {
      const res = await API.get("/users");
      tbody.innerHTML = res.data.map(u => `
        <tr>
          <td>${u.name}</td><td>${u.email}</td><td>${u.role}</td><td>${u.team || "—"}</td>
          <td>${u.is_active ? "Yes" : "No"}</td>
          <td><button class="btn btn-ghost btn-sm toggle-active" data-id="${u.id}" data-active="${u.is_active}">${u.is_active ? "Disable" : "Enable"}</button></td>
        </tr>
      `).join("");
      document.querySelectorAll(".toggle-active").forEach(btn => {
        btn.addEventListener("click", async () => {
          const isActive = btn.dataset.active === "true";
          try {
            await API.put(`/users/${btn.dataset.id}`, { is_active: !isActive });
            showToast("User updated");
            loadUsers();
          } catch (e) { showToast(e.message, "error"); }
        });
      });
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="6" style="color:#e5484d">${e.message}</td></tr>`;
    }
  }

  document.getElementById("new-user-btn").addEventListener("click", () => {
    document.getElementById("new-user-form").style.display = "block";
  });

  document.getElementById("save-user-btn").addEventListener("click", async () => {
    const errorEl = document.getElementById("user-form-error");
    errorEl.textContent = "";
    try {
      await API.post("/users", {
        name: document.getElementById("nu-name").value.trim(),
        email: document.getElementById("nu-email").value.trim(),
        password: document.getElementById("nu-password").value,
        role: document.getElementById("nu-role").value,
      });
      showToast("User created");
      document.getElementById("new-user-form").style.display = "none";
      loadUsers();
    } catch (e) {
      errorEl.textContent = e.message;
    }
  });

  loadUsers();
</script>
{% endblock %}
