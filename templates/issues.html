{% extends "base.html" %}
{% block title %}Issues{% endblock %}
{% block content %}
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
  <h2>Issues</h2>
  <a href="/issues/new" class="btn btn-primary">+ New Issue</a>
</div>

<div class="filters">
  <select id="filter-status">
    <option value="">All statuses</option>
    <option>OPEN</option><option>ASSIGNED</option><option>IN_PROGRESS</option>
    <option>RESOLVED</option><option>CLOSED</option><option>REJECTED</option>
  </select>
  <select id="filter-priority">
    <option value="">All priorities</option>
    <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
  </select>
  <input type="text" id="filter-search" placeholder="Search title/description..." />
  <button class="btn btn-ghost" id="apply-filters">Apply</button>
</div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>ID</th><th>Title</th><th>Category</th><th>Priority</th><th>Status</th>
        <th>Vehicle</th><th>Hub</th><th>Created</th>
      </tr>
    </thead>
    <tbody id="issues-tbody"></tbody>
  </table>
  <p id="empty-state" style="display:none; color:#6b7280;">No issues found.</p>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/issues.js') }}"></script>
{% endblock %}
