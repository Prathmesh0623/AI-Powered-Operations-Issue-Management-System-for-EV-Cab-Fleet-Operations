{% extends "base.html" %}
{% block title %}Drivers{% endblock %}
{% block content %}
<h2>Drivers</h2>
<div class="card">
  <table>
    <thead><tr><th>Name</th><th>Status</th><th>Hub</th><th>Vehicle</th></tr></thead>
    <tbody id="drivers-tbody"></tbody>
  </table>
</div>
{% endblock %}
{% block extra_js %}
<script>
  requireAuth();
  API.get("/drivers").then(res => {
    document.getElementById("drivers-tbody").innerHTML = res.data.map(d => `
      <tr><td>${d.name}</td><td>${d.status}</td><td>${d.hub || "—"}</td><td>${d.vehicle || "—"}</td></tr>
    `).join("") || "<tr><td colspan='4' style='color:#6b7280'>No drivers found.</td></tr>";
  });
</script>
{% endblock %}
