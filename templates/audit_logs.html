{% extends "base.html" %}
{% block title %}Audit Logs{% endblock %}
{% block content %}
<h2>Audit Logs</h2>
<div class="card">
  <table>
    <thead><tr><th>User</th><th>Action</th><th>Entity</th><th>Entity ID</th><th>Old Value</th><th>New Value</th><th>Timestamp</th></tr></thead>
    <tbody id="audit-tbody"></tbody>
  </table>
</div>
{% endblock %}
{% block extra_js %}
<script>
  requireAuth();
  API.get("/audit-logs").then(res => {
    document.getElementById("audit-tbody").innerHTML = res.data.items.map(a => `
      <tr>
        <td>${a.user}</td><td>${a.action}</td><td>${a.entity || "—"}</td><td>${a.entity_id ?? "—"}</td>
        <td>${a.old_value ?? "—"}</td><td>${a.new_value ?? "—"}</td>
        <td>${new Date(a.timestamp).toLocaleString()}</td>
      </tr>
    `).join("") || "<tr><td colspan='7' style='color:#6b7280'>No audit records yet.</td></tr>";
  }).catch(e => {
    document.getElementById("audit-tbody").innerHTML = `<tr><td colspan="7" style="color:#e5484d">${e.message}</td></tr>`;
  });
</script>
{% endblock %}
