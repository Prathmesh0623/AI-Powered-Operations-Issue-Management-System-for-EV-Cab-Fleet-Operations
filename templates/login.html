<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login — AI Operations Management</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1>AI Operations Management</h1>
      <p>Sign in to continue</p>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="manager@demo.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" />
      </div>
      <button class="btn btn-primary" style="width:100%" id="login-btn">Log in</button>
      <p id="error-msg" style="color:#e5484d; font-size:13px; margin-top:10px;"></p>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script>
    document.getElementById("login-btn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("error-msg");
      errorEl.textContent = "";
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const json = await res.json();
        if (!res.ok || !json.success) {
          errorEl.textContent = json.message || "Login failed";
          return;
        }
        localStorage.setItem("access_token", json.data.access_token);
        window.location.href = "/issues";
      } catch (e) {
        errorEl.textContent = "Could not reach the server.";
      }
    });
  </script>
</body>
</html>
